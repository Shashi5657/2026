<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }

      /* Fixed Sidebar */
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 200px;
        height: 100vh;
        background: #111;
        color: white;
      }

      /* Main Content */
      .main {
        margin-left: 200px;
      }

      /* Sticky Header */
      .header {
        position: sticky;
        top: 0;
        background: white;
        padding: 16px;
        border-bottom: 1px solid #ddd;
        z-index: 10;
      }

      /* Card */
      .card {
        position: relative;
        margin: 40px;
        padding: 20px;
        border: 1px solid #ccc;
      }

      /* Absolute Badge */
      .notification {
        position: absolute;
        top: -10px;
        right: -10px;
        background: red;
        color: white;
        padding: 6px 10px;
        border-radius: 50%;
      }
      .section {
        height: 600px;
      }

      .sticky-title {
        position: sticky;
        top: 0;
        background: white;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">Sidebar</div>

    <div class="main">
      <header class="header">Dashboard Header</header>

      <div class="card">
        <span class="notification">3</span>
        Card Content
      </div>
    </div>

    <div class="section">
      <h2 class="sticky-title">Section Title</h2>
      <p>Lots of content...</p>
    </div>
  </body>
</html>
